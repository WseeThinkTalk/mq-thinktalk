Name: mq
KqConsumerConf:
  Name: message-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-thinktalk-message
  Topic: thinktalk_notification
  Offset: last
  Consumers: 1
  Processors: 1
Mysql:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
CacheRedis:
    - Host: ${REDIS_HOST}:${REDIS_PORT}
      Type: node
      Pass: ${REDIS_PASS}
