Name: thinktalk.mq

DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
Mysql:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
CacheRedis:
  - Host: ${REDIS_HOST}:${REDIS_PORT}
    Type: node
    Pass: ${REDIS_PASS}

UserRPC:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true
  Timeout: 10000

Es:
  Addresses:
    - http://${ES_HOST:127.0.0.1}:${ES_PORT:9200}/
  Username: ${ES_USER:}
  Password: ${ES_PASS:}

KqPusherConf:
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Topic: thinktalk_notification

ArticleKq:
  Name: article-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-like-count
  Topic: thinktalk_like_count
  Offset: last
  Consumers: 1
  Processors: 1

ArticleEventKq:
  Name: article-cache-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-article-event
  Topic: thinktalk_article
  Offset: last
  Consumers: 1
  Processors: 1

ChatKq:
  Name: chat-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-thinktalk-chat
  Topic: thinktalk_chat
  Offset: last
  Consumers: 2
  Processors: 2

ConcernedKq:
