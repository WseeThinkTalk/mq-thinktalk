Name: mq
KqConsumerConf:
  Name: qa-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-thinktalk-qa
  Topic: thinktalk_qa
  Offset: last
  Consumers: 1
  Processors: 1
Mysql:
  DataSource: host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASS} dbname=Ask sslmode=disable
Es:
  Addresses:
    - http://localhost:9200/
  Username:
  Password:
CacheRedis:
    - Host: ${REDIS_HOST}:${REDIS_PORT}
      Type: node
      Pass: ${REDIS_PASS}
